apis:
  - aid: openvpn:cloudconnexa-api
    name: CloudConnexa Public API
    description: >-
      REST API for managing CloudConnexa Zero Trust networks, users,
      networks, connectors, DNS, routes, and access policies. Authentication
      uses OAuth 2.0 client credentials grant; API credentials are
      generated from the CloudConnexa Admin Portal.
    humanURL: https://openvpn.net/cloud-docs/developer/cloudconnexa-api.html
    baseURL: https://myaccount.openvpn.com/api/beta
    tags:
      - VPN
      - Zero Trust
      - Cloud Security
      - REST
    properties:
      - type: Documentation
        url: https://openvpn.net/cloud-docs/developer/cloudconnexa-api.html
      - type: GettingStarted
        url: https://openvpn.net/cloud-docs/owner/api-documentation/creating-api-credentials.html
  - aid: openvpn:access-server-xmlrpc
    name: OpenVPN Access Server XML-RPC API
    description: >-
      XML-RPC management API exposing hundreds of methods to control and
      monitor every aspect of an OpenVPN Access Server deployment, including
      user provisioning, permissions, configuration, and status. Requires
      enabling the XML-RPC interface at the full API level on the server.
    humanURL: https://openvpn.net/as-docs/
    baseURL: https://<access-server-host>/RPC2/
    tags:
      - VPN
      - XML-RPC
