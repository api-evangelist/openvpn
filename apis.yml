aid: openvpn
name: OpenVPN
description: >-
  OpenVPN is a secure networking company providing VPN and Zero Trust
  network access solutions for over 20,000 organizations worldwide,
  offering both the self-hosted Access Server and the cloud-delivered
  CloudConnexa managed service. The platform supports encrypted tunnels,
  identity-based access policies, content filtering, IDS/IPS, and
  domain-based traffic rules across major cloud providers. OpenVPN exposes
  an XML-RPC management API for Access Server and an OAuth 2.0 protected
  REST API for CloudConnexa.
